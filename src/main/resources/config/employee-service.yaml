server: 
  port: 8082

spring: 
  datasource: 
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:  
    hibernate:  
      ddl-auto: update
    show-sql: true
    properties: 
      hibernate: 
        dialect=org.hibernate.dialect.PostgreSQLDialect
management: 
  endpoints:
    web:
      exposure: 
        include: "*"
  tracing:
    sampling: 
      probability: 1.0
eureka:
  instance:
    hostname: localhost
    port: 8761
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl: 
      defaultZone: http://${eureka.instance.hostname}:${eureka.instance.port}/eureka/